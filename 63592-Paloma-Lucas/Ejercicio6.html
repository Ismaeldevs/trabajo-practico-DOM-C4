<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 6</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .tarjeta {
      background-color: #16213e;
      padding: 30px;
      border-radius: 16px;
      width: 300px;
      text-align: center;
      margin-bottom: 20px;
    }

    .tarjeta h3 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #e94560;
    }

    .tarjeta p {
      font-size: 14px;
      color: #aaa;
    }

    .oculto {
      display: none;
    }

    button {
      padding: 10px 30px;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c73652;
    }
  </style>
</head>
<body>

  <h2>👁️ Mostrar y Ocultar</h2>

  <div class="tarjeta" id="tarjeta">
    <h3>Informacion importante</h3>
    <p>Este contenido puede mostrarse u ocultarse con el boton.</p>
  </div>

  <button id="btnToggle">Ocultar</button>

  <script src="ej6.js"></script>
</body>
</html>
