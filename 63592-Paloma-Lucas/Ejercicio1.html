<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      letter-spacing: 2px;
      transition: color 0.4s ease;
    }

    button {
      padding: 12px 30px;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c73652;
    }
  </style>
</head>
<body>

  <h1 id="titulo">Esperando cambio...</h1>
  <button id="btnCambiar">Cambiar titulo</button>

  <script src="ej1.js"></script>
</body>
</html>
