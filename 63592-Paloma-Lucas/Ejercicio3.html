<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 3 - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      color: white;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .formulario {
      background-color: #16213e;
      padding: 30px;
      border-radius: 16px;
      width: 300px;
    }

    label {
      font-size: 13px;
      color: #aaa;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #0f3460;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #e94560;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c73652;
    }

    #mensaje {
      margin-top: 14px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h2>🔐 Iniciar Sesion</h2>

  <div class="formulario">

    <label>Usuario:</label>
    <input type="text" id="usuario" placeholder="Tu usuario" />

    <label>Contrasenia:</label>
    <input type="password" id="contrasena" placeholder="Tu contrasenia" />

    <button id="btnLogin">Ingresar</button>

    <p id="mensaje"></p>

  </div>

  <script src="ej3.js"></script>
</body>
</html>
