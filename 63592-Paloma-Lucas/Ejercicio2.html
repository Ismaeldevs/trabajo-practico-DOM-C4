<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 2 - Semaforo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1a1a2e;
      color: white;
      padding: 40px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #cuadrado {
      width: 250px;
      height: 250px;
      background: #444;
      border-radius: 20px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }

    .botones {
      display: flex;
      gap: 20px;
    }

    .botones button {
      width: 100px;
      height: 100px;
      border: none;
      border-radius: 50%;
      font-size: 36px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }

    .botones button:hover {
      transform: scale(1.15);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .botones button:active {
      transform: scale(0.95);
    }

    #btnRojo     { background-color: #e74c3c; }
    #btnAmarillo { background-color: #f1c40f; }
    #btnVerde    { background-color: #2ecc71; }

    .etiquetas {
      display: flex;
      gap: 20px;
      margin-top: 12px;
    }

    .etiquetas span {
      width: 100px;
      text-align: center;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h2>🚦 Semaforo de colores</h2>

  <div id="cuadrado">⬜</div>

  <div class="botones">
    <button id="btnRojo">🔴</button>
    <button id="btnAmarillo">🟡</button>
    <button id="btnVerde">🟢</button>
  </div>

  <div class="etiquetas">
    <span>Rojo</span>
    <span>Amarillo</span>
    <span>Verde</span>
  </div>

  <script src="ej2.js"></script>
</body>
</html>
