<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    input {
      padding: 10px 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #0f3460;
      color: white;
      font-size: 15px;
      outline: none;
      width: 260px;
    }

    input:focus {
      border-color: #e94560;
    }

    #preview {
      margin-top: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #e94560;
      letter-spacing: 1px;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h2>👤 Mostrar nombre en tiempo real</h2>

  <input type="text" id="inputNombre" placeholder="Escribi tu nombre..." />

  <p id="preview">Escribi tu nombre arriba.</p>

  <script src="ej4.js"></script>
</body>
</html>
